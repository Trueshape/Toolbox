<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbox siti</title>
<style>
  :root { --bg:#0b0b0e; --tile:#121216; --line:#26262e; --ink:#f2f2f4; --soft:#b4b4bd; --mute:#8a8a94; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#0b0b0e; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; padding:24px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:13px; margin-bottom:20px; }
  .cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .cat { border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; color:var(--soft); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
  .card { background:var(--tile); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h3 { margin:0 0 6px; font-size:15px; font-weight:600; }
  .card p { margin:0 0 10px; color:var(--soft); font-size:14px; }
  .card small { color:var(--mute); font-size:12px; word-break:break-all; }
  .msg { color:var(--mute); }
</style>
</head>
<body>
<h1>Toolbox</h1>
<p class="sub">Siti salvati. Copia sincronizzata dal catalogo locale.</p>
<div class="cats" id="cats"></div>
<div class="grid" id="sites"></div>
<p class="msg" id="msg">Caricamento…</p>
<script>
(async () => {
  const msg = document.getElementById("msg");
  const claude = window.claude;
  const db = claude ? await claude.use("db") : null;
  if (!db) { msg.textContent = "Database non disponibile in questa vista."; return; }

  let categories = [];
  let sites = [];

  function renderCats() {
    const box = document.getElementById("cats");
    box.replaceChildren(...categories.map((c) => {
      const el = document.createElement("span");
      el.className = "cat";
      el.textContent = (c.icon ? c.icon + " " : "") + c.name;
      return el;
    }));
  }

  function renderSites() {
    const box = document.getElementById("sites");
    box.replaceChildren(...sites.map((s) => {
      const card = document.createElement("div");
      card.className = "card";
      const h = document.createElement("h3"); h.textContent = s.nome || "";
      const p = document.createElement("p"); p.textContent = s.descrizione || "";
      const a = document.createElement("small"); a.textContent = (s.categorie || []).join(" · ") + "  —  " + (s.url || "");
      card.append(h, p, a);
      return card;
    }));
    msg.textContent = sites.length ? "" : "Nessun sito.";
  }

  db.collection("categories").onSnapshot((snap) => {
    categories = snap.docs.filter((d) => d.exists).map((d) => d.data()).filter(Boolean);
    renderCats();
  }, () => { msg.textContent = "Errore di lettura."; });

  db.collection("sites").onSnapshot((snap) => {
    sites = snap.docs.filter((d) => d.exists).map((d) => d.data()).filter(Boolean);
    renderSites();
  }, () => { msg.textContent = "Errore di lettura."; });
})();
</script>
</body>
</html>
